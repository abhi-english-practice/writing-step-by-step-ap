<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pop Dossier · Writing Parts 1–4</title><style>*{box-sizing:border-box}:root{--ink:#202225;--paper:#fffdf5;--lime:#c8ff46;--pink:#ff4fa3;--cyan:#65e7ff}body{margin:0;background:var(--ink);color:var(--ink);font:16px/1.6 Arial,sans-serif}header{max-width:1120px;margin:auto;padding:18px 22px;color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:2px}.brand b{color:var(--lime)}button,select{font:700 14px Arial;color:var(--ink);padding:11px 15px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);cursor:pointer}button:hover{background:var(--cyan)}button:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid #a90058;outline-offset:3px}main{max-width:1080px;margin:0 auto 35px;padding:26px;background:#f3f0e6;border:2px solid #111;border-radius:16px}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}nav button{box-shadow:3px 3px 0 var(--ink)}nav button[aria-pressed=true]{background:var(--lime)}h1{font:700 clamp(30px,5vw,44px)/1.15 Georgia;margin:8px 0 16px}.kicker{font:700 12px monospace;letter-spacing:2px}.intro{max-width:790px;margin-bottom:22px}.card{background:var(--paper);border:2px solid;border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:22px;margin:0 0 22px}label.prompt{display:block;font-weight:700;margin-bottom:14px}.number{display:inline-block;background:var(--cyan);padding:3px 10px;border:1.5px solid;border-radius:6px;margin-right:8px}textarea{width:100%;display:block;resize:vertical;min-height:110px;border:1.5px solid #96958c;border-radius:7px;padding:14px;font:18px/1.7 Georgia;background:#fffefb;color:var(--ink)}.short textarea{min-height:65px;height:65px}.long textarea{min-height:310px}.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:12px/1.6 monospace;margin-top:9px}.good{color:#315f11}.over{color:#a11c49}.sample{white-space:pre-wrap;font:17px/1.8 Georgia;margin:14px 0 0}details{border-top:1px solid #d8d4c8;margin-top:17px;padding-top:12px}summary{cursor:pointer;font-size:13px;font-weight:700}.notice{white-space:pre-wrap;font:18px/1.8 Georgia;border-top:9px solid var(--cyan)}.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tools button{box-shadow:2px 2px 0}.primary{background:var(--lime)}.hint{font:12px/1.6 Arial;color:#555}#status{font-size:12px}.range{margin:0 0 22px}dialog{max-width:360px;border:2px solid;border-radius:12px;padding:24px}dialog::backdrop{background:#0008}@media(max-width:600px){main{margin:0 10px 25px;padding:17px 13px}header{padding:15px}nav{gap:8px}nav button{padding:10px 3px;font-size:12px}.card{padding:16px}.tools button{font-size:12px;padding:10px}.intro{font-size:14px}}@media print{body{background:white}header,nav,.tools,details,.range{display:none}main{border:0;margin:0;padding:0}.card{box-shadow:none;break-inside:avoid}textarea{border:0;min-height:0}.print-answer{white-space:pre-wrap}textarea{display:none}}</style></head><body><header><div class="brand">POP <b>DOSSIER</b></div><span id="status">Writing practice</span></header><main><nav id="nav" aria-label="Writing part"></nav><div class="kicker" id="tag"></div><h1 id="title"></h1><p class="intro" id="intro"></p><div id="content"></div><div class="tools"><button id="download" class="primary">Download answers</button><button id="reset">Clear this part</button><span class="hint">Word count only · Writing is not automatically graded.</span></div></main><dialog id="confirm"><p>Clear your answers in this part?</p><div class="tools"><button id="cancel">Cancel</button><button id="erase">Clear answers</button></div></dialog><script>const PARTS=[{"title": "Short answers", "intro": "You want to join a movie club. Write 1–5 words to each message.", "qs": [["Where do you like going on holidays?", "Anywhere near the sea."], ["What do you like doing when it rains?", "Watching Netflix on the sofa."], ["What’s your favourite kind of film?", "I really enjoy comedies."], ["Can you drive?", "Yes, I can."], ["Do you prefer weekdays or weekend to go to the movies?", "Weekends, because I have time."]], "lo": 1, "hi": 5}, {"title": "Recommend a movie", "intro": "You are a new member of a movie club. Fill in the form. Write in sentences. Use 20–30 words.", "qs": [["Aptis Movie Club: Please recommend a movie for our next session.", "I recommend Finding Nemo because it combines a touching story with beautiful animation. Its memorable characters and gentle humour make it an enjoyable choice for everyone."]], "lo": 20, "hi": 30}, {"title": "Club chat", "intro": "You are a new member of a movie club. You are talking to three other members in the movie club chat room. Talk to them using sentences. Answer all three questions.", "qs": [["Pete: Hi! I’m very happy to see you here. Do you like going to the movies on your own?", "Sometimes I go alone because I can choose any film I like. However, I usually prefer going with friends and discussing the story afterwards."], ["Carol: Hi! I’m very happy to see you here. Do you like having a snack while watching a film?", "Yes, I usually have some popcorn while watching a film. However, I avoid noisy snacks because I do not want to disturb other people."], ["Simone: Do you agree special effects are an essential part of a movie?", "Not always. Special effects can make action films exciting, but a strong story matters more to me. Some excellent dramas hardly use any effects."]], "lo": 20, "hi": 30}, {"title": "Two emails", "intro": "You are a new member of a movie club. You received this email from the club.", "notice": "Dear Members,\nAs you know, our theatre is now a bit outdated, so we have decided to do some renovations to make our weekly meetings more comfortable and memorable. We are going to change the seats, and the sound equipment. We are hoping to count with your support. Please contact the school secretary to make your contribution either as a patron or a volunteer, or both. We are very enthusiastic about this good news, and hope you will be as well. Unfortunately though, the club will be closed for a month during the renovation works.", "qs": [["Write an email to your friend. Write about your feelings and what you think about the movie club plans. Write about 50 words.", "Hi Ben,\n\nHave you heard about the club renovations? I’m pleased we’re getting better seats and sound equipment, but a month without films is disappointing. Perhaps we could organise movie nights at home while the theatre is closed. I’d also like to volunteer. What do you think?\n\nCheers,\nJim"], ["Write an email to the president of the club. Write about your feelings and what you think about the club plans. Write 120–150 words.", "Dear President,\n\nThank you for informing us about the planned renovations. I am pleased that the club is investing in more comfortable seats and better sound equipment, as these improvements should make our weekly meetings more enjoyable.\n\nHowever, I am disappointed that the theatre will close for a month. Many members look forward to our regular screenings, especially when poor weather prevents outdoor activities. Would it be possible to arrange temporary screenings at the local community centre? This would help members stay in touch during the closure.\n\nI would also be happy to volunteer at weekends. Please could you let me know which tasks need support and whether volunteers require any training?\n\nThank you for considering my suggestions. I look forward to hearing more about the schedule.\n\nKind regards,\nJim"]], "lo": 120, "hi": 150}];const KEY='pop-writing-movie-v1';let state={part:0,answers:{},range:20};try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s.answers==='object'&&s.answers){state.answers=s.answers;state.part=[0,1,2,3].includes(s.part)?s.part:0;state.range=s.range===30?30:20}}catch(e){}const $=id=>document.getElementById(id);const count=s=>(s.match(/[\p{L}\p{N}]+(?:[’'–-][\p{L}\p{N}]+)*/gu)||[]).length;function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('status').textContent='Saved on this device'}catch(e){$('status').textContent='Use Download answers to save your work'}}function limits(i){if(state.part===3&&i===0)return[45,55];if(state.part===2)return[state.range,state.range+10];return[PARTS[state.part].lo,PARTS[state.part].hi]}function update(i){const k=state.part+'-'+i,n=count(state.answers[k]||''),[lo,hi]=limits(i),e=$('count'+i);e.textContent=n+' words · '+(n===0?'Not started':n<lo?'Below target':n>hi?'Above target':'Within target');e.className=n>=lo&&n<=hi?'good':n>hi?'over':'';$('print'+i).textContent=state.answers[k]||''}function render(){const p=PARTS[state.part];$('nav').innerHTML=PARTS.map((p,i)=>`<button aria-pressed="${state.part===i}" data-part="${i}">Part ${i+1}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.part=+b.dataset.part;save();render()});$('title').textContent=p.title;$('tag').textContent='WRITING / 0'+(state.part+1);$('intro').textContent=p.intro;$('content').replaceChildren();if(state.part===2){let d=document.createElement('div');d.className='range';d.innerHTML='<label for="range">Word target </label><select id="range"><option value="20">20–30 · task box</option><option value="30">30–40 · chapter guide</option></select>';$('content').append(d);$('range').value=state.range;$('range').onchange=()=>{state.range=+$('range').value;save();p.qs.forEach((_,i)=>update(i))}}if(p.notice){let d=document.createElement('div');d.className='card notice';d.textContent=p.notice;$('content').append(d)}p.qs.forEach((q,i)=>{let d=document.createElement('section');d.className='card '+(state.part===0?'short':state.part===3?'long':'');d.innerHTML=`<label class="prompt" for="answer${i}"><span class="number">${String(i+1).padStart(2,'0')}</span><span class="qtext"></span></label><textarea id="answer${i}" spellcheck="true" lang="en" placeholder="Write your answer…"></textarea><div class="print-answer" id="print${i}" hidden></div><div class="meta"><span id="count${i}" aria-live="polite"></span><span>${state.part===3&&i===0?'About 50 words':''}</span></div><details><summary>Sample answer</summary><p class="sample"></p></details>`;d.querySelector('.qtext').textContent=q[0];d.querySelector('.sample').textContent=q[1];$('content').append(d);let t=$('answer'+i);t.value=typeof state.answers[state.part+'-'+i]==='string'?state.answers[state.part+'-'+i]:'';t.oninput=()=>{state.answers[state.part+'-'+i]=t.value;update(i);save()};update(i)})} $('download').onclick=()=>{let text=PARTS.map((p,j)=>'PART '+(j+1)+' — '+p.title+'\n\n'+p.qs.map((q,i)=>q[0]+'\n'+(state.answers[j+'-'+i]||'[No answer]')).join('\n\n')).join('\n\n--------------------\n\n');let u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='my-writing-answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('reset').onclick=()=>$('confirm').showModal();$('cancel').onclick=()=>$('confirm').close();$('erase').onclick=()=>{PARTS[state.part].qs.forEach((_,i)=>delete state.answers[state.part+'-'+i]);save();render();$('confirm').close()};render();</script></body></html>
